<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="EasyFlowHub layered-glass flow icon">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6eefb"/>
      <stop offset="1" stop-color="#c3d6ef"/>
    </linearGradient>
    <linearGradient id="pane1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#dbe7f8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="pane2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c6ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#6f93c4" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft2" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2b3d55" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg2)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>

  <!-- back glass pane -->
  <g filter="url(#soft2)">
    <rect x="120" y="118" width="230" height="150" rx="30" fill="url(#pane1)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>
  </g>
  <g stroke="#8fb0d8" stroke-width="8" stroke-linecap="round" opacity="0.7">
    <line x1="150" y1="160" x2="270" y2="160"/>
    <line x1="150" y1="192" x2="320" y2="192"/>
    <line x1="150" y1="224" x2="240" y2="224"/>
  </g>

  <!-- front accent pane -->
  <g filter="url(#soft2)">
    <rect x="170" y="238" width="230" height="150" rx="30" fill="url(#pane2)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
  </g>
  <path d="M212 313 h58 l-16 -16 M269 313 l-16 16" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="290" y1="313" x2="356" y2="313" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
</svg>
