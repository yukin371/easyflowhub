<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="EasyFlowHub monogram lightning icon">
  <defs>
    <linearGradient id="bg4b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#405a80"/>
      <stop offset="1" stop-color="#1c2a3e"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0f7"/>
      <stop offset="1" stop-color="#8fb4e6"/>
    </linearGradient>
    <filter id="soft4" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0d1622" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg4b)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- subtle ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#8fb4e6" stroke-opacity="0.25" stroke-width="3"/>

  <!-- lightning bolt (act) -->
  <path d="M286 128 L180 286 H246 L222 388 L336 224 H266 Z"
        fill="url(#bolt)" filter="url(#soft4)"
        stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linejoin="round"/>
</svg>
