<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="EasyFlowHub hub-network icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce8f7"/>
      <stop offset="1" stop-color="#b9cfeb"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb4e6"/>
      <stop offset="1" stop-color="#4f74a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#86abdc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#86abdc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2b3d55" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded-square app canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>

  <circle cx="256" cy="256" r="150" fill="url(#glow)"/>

  <!-- spokes: capture / understand / retrieve / act -->
  <g stroke="#5b7fb0" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="256" x2="256" y2="132"/>
    <line x1="256" y1="256" x2="380" y2="256"/>
    <line x1="256" y1="256" x2="256" y2="380"/>
    <line x1="256" y1="256" x2="132" y2="256"/>
  </g>

  <!-- satellite nodes -->
  <g filter="url(#soft)">
    <circle cx="256" cy="120" r="30" fill="#ffffff" stroke="#7ba0d0" stroke-width="6"/>
    <circle cx="392" cy="256" r="30" fill="#ffffff" stroke="#7ba0d0" stroke-width="6"/>
    <circle cx="256" cy="392" r="30" fill="#ffffff" stroke="#7ba0d0" stroke-width="6"/>
    <circle cx="120" cy="256" r="30" fill="#ffffff" stroke="#7ba0d0" stroke-width="6"/>
  </g>

  <!-- center hub -->
  <circle cx="256" cy="256" r="66" fill="url(#core)" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="66" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
  <path d="M256 214 L256 298 M256 214 L226 244 M256 214 L286 244" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92"/>
</svg>
