name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: easyflowhub-app

jobs:
  test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Run type check
        run: bunx tsc --noEmit

  scriptmgr-go-test:
    name: Go Tests (scriptmgr-go)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scriptmgr-go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scriptmgr-go/go.mod

      - name: Run tests
        run: go test ./...

  scriptmgr-go-lint:
    name: Go Lint (scriptmgr-go)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scriptmgr-go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scriptmgr-go/go.mod

      - name: Lint
        run: go vet ./...

  scriptmgr-go-build:
    name: Build (scriptmgr-go)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scriptmgr-go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scriptmgr-go/go.mod

      - name: Build
        run: go build -o scriptmgr.exe ./cmd/scriptmgr

  architecture-gates:
    name: Architecture Gates
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Architecture guard (cycles / layers / invoke baseline / size debt)
        run: node scripts/check-architecture.mjs

      - name: Native architecture guard (crate layers / symbol leaks / size)
        run: node scripts/check-native-architecture.mjs

  native-windows:
    name: Native Tests (Windows)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: easyflowhub-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scriptmgr-go/go.mod

      # tauri.conf.json bundles ../../scriptmgr-go/scriptmgr.exe as a resource,
      # so the build script rejects `cargo check` while that file is missing.
      # The Tauri build runs build.rs which produces it; a bare check must not.
      - name: Build scriptmgr sidecar
        shell: pwsh
        run: |
          $scriptmgrDir = Resolve-Path "..\scriptmgr-go"
          Push-Location $scriptmgrDir
          try {
            $env:CGO_ENABLED = "0"
            go build -ldflags="-s -w" -o scriptmgr.exe ./cmd/scriptmgr
            if ($LASTEXITCODE -ne 0) { throw "go build failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: easyflowhub-app/src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo test (lib)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # The native shell is not wired into the product yet, but it holds the only
  # gates that can overturn the runtime decision (ADR-0009). Its 43 tests and the
  # egui/winit/glow/hub-editor dependency graph have to keep compiling on a clean
  # Windows runner, or a finished spike silently rots while the next one is being
  # written. `cargo test --workspace` also covers the new hub-editor crate without
  # this file needing to know its name.
  native-crates:
    name: Native Shell (Windows)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: cargo test (workspace)
        run: cargo test --workspace

      # Debug tests prove the logic; the spike is only valid as a release build
      # (opt-level 2), which is what every archived latency sample came from.
      - name: cargo build (release)
        run: cargo build --release -p app
