[package]
name = "easyflowhub"
version = "0.2.0"
description = "Desktop productivity hub - Notes, Todos, Scripts & more"
authors = ["yukin"]
edition = "2021"

[lib]
name = "easyflowhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
open = "5"
base64 = "0.22"
url = "2"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "multipart"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.15"
hound = "3.5"
clipboard-win = "5.4"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi"] }
raw-window-handle = "0.6"
winreg = "0.55"
